context: |
    Write a Python function ``count_to(n)`` returning the list ``[1, 2, ..., n]``.

    The grading script runs 4 tests; grade = 25% per passing test. It sets the course
    tags ``skill_loop`` (visible skill), ``skill_hidden`` (staff-only skill),
    ``misc_off_by_one`` (misconception) and an auto-tag, a ``custom`` value and the
    task ``state``. A correct answer is::

        def count_to(n):
            result = []
            for i in range(1, n + 1):
                result.append(i)
            return result
