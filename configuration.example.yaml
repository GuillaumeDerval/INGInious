# Example configuration of the INGInious web frontend (frontend/, read through the
# INGINIOUS_CONFIG environment variable). See doc/admin_doc/install_doc/config_reference.rst.

# Address of the backend (client port), started separately (inginious-backend).
backend: tcp://127.0.0.1:2000

# MongoDB options
mongo_opt:
    host: localhost
    database: INGInious

# Location of the task directory (shared with the grading agents)
tasks_directory: ./tasks

# Folder of the course archives
backup_directory: ./backups

# Session cookie: secret_key is mandatory (e.g. `openssl rand -hex 32`)
session_parameters:
    secret_key: change-me-to-a-long-random-string
    secure: true
    timeout: 86400

# Public URL of the platform (links sent by e-mail, OAuth/SAML callbacks)
base_url: https://inginious.example.org

# URL of an INGInious-xterm server for in-browser ssh debugging (remove if unused)
webterm: "https://my-host.be:8080"

# WebDAV access to course files, served by the frontend under /dav (remove to hide it)
webdav_host: https://inginious.example.org/dav

# Plugins loaded by the frontend (same plugin_module names as before)
plugins:
  - plugin_module: inginious.frontend.plugins.scoreboard
  - plugin_module: inginious.frontend.plugins.contests
  - plugin_module: inginious.frontend.plugins.upcoming_tasks

# Superadmins: list of user names that are administrators on all courses
superadmins:
  - superadmin

# Self-registration and account deletion
allow_registration: true
allow_deletion: true

# Disable INGInious?
maintenance: false

# Email info
smtp:
    sendername: 'INGInious <no-reply@inginious.org>'
    host: 'smtp.example.org'
    port: 587
    username: 'configme'
    password: 'secret'
    starttls: true

# Behind a reverse proxy: trust its X-Forwarded-* headers (protocol, host, client address)
reverse-proxy-config:
    enable: false
    x-for: 1
    x-host: 1
