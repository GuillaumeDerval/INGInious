name: "CI/CD"

on:
  push:
    branches: [ main, v0.9.x ]
  pull_request:
    branches: [ main, v0.9.x ]
  release:
    types: [published]
  workflow_dispatch:

env:
  REGISTRY: "ghcr.io"
  VERSION: "${{ github.event_name == 'push' && github.ref_name || (github.event_name == 'release' && github.event.release.tag_name || 'ci') }}"
  CORE_CONTAINERS: "backend frontend agent_mcq agent_docker"
  ENV_CONTAINERS: "base default python3"

jobs:
  build_deploy_push:
    runs-on: ubuntu-24.04
    needs: [tests, frontend_static, frontend_tests]
    steps:
      - uses: actions/checkout@v7

      - name: Build core services
        run: for stage in ${CORE_CONTAINERS}; do docker build -f deploy/Containerfile --target=${stage} -t ${REGISTRY}/inginious/core-${stage}:${VERSION} . ; done

      - name: Build base environments
        working-directory: base-containers/base
        run: for stage in ${ENV_CONTAINERS}; do docker build --target=env-${stage} -t ${REGISTRY}/inginious/env-${stage}:${VERSION} . ; done

      - name: Test deployment
        id: deploy
        run: |
          docker compose up --wait --wait-timeout 60
        timeout-minutes: 2
        continue-on-error: true

      - name: Compose logs on failure
        if: steps.deploy.outcome == 'failure'
        run: |
          docker compose logs
          exit 1

      - name: Login to Docker Hub
        if: steps.deploy.outcome == 'success' && github.event_name != 'pull_request'
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Push containers
        if: steps.deploy.outcome == 'success' && github.event_name != 'pull_request'
        run: |
          for stage in ${CORE_CONTAINERS}; do docker push ${REGISTRY}/inginious/core-${stage}:${VERSION}; done
          for stage in ${ENV_CONTAINERS}; do docker push ${REGISTRY}/inginious/env-${stage}:${VERSION}; done

  compose_build_and_deploy:
    runs-on: ubuntu-24.04
    needs: [tests, frontend_static, frontend_tests]
    steps:
      - uses: actions/checkout@v7

      - name: Test deployment
        id: deploy
        run: docker compose up --build --wait --wait-timeout 600
        timeout-minutes: 15
        continue-on-error: true
        
      - name: Compose logs on failure
        if: steps.deploy.outcome == 'failure'
        run: |
          docker compose logs
          exit 1

  tests:
    strategy:
      # Ensure that each python version will be tested even if one of them fails.
      fail-fast: false
      matrix:
        python_version: ["3.11", "3.12", "3.13", "3.14"]

    runs-on: ubuntu-24.04
    services:
      mongo:
        image: mongo
        ports:
          - 27017:27017

    steps:

      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python_version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python_version }}

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libtidy5deb1 libzmq3-dev

      - name: Install INGInious
        run: |
          pip3 install .
          pip3 install .[test]

      - name: Launch pytest tests
        run: coverage run -a --branch -m pytest -v

      - name: Launch pytest tests not requiring INGInious modules
        run: |
          python3 -m venv env
          env/bin/pip3 install jinja2==3.1.3 pytest==8.0.0 coverage==7.4.1
          env/bin/coverage run --branch -m pytest -v inginious/scripts/task_tester

      - name: Generate coverage report
        # Launch even if one of the two test jobs fails
        if: always()
        run: |
          coverage report --include="inginious/*"
          coverage xml --include="inginious/*"

      - name: Save coverage output
        uses: codacy/codacy-coverage-reporter-action@v1
        if: ${{ github.event_name == 'push' }}
        with:
          project-token: ${{ secrets.CODACY_PROJECT_TOKEN }}
          coverage-reports: coverage.xml

  # Web frontend (SvelteKit, frontend/): types, lint, formatting and production builds.
  frontend_static:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx svelte-kit sync && npx svelte-check --threshold warning

      - name: Lint and formatting
        run: npx eslint . && npx prettier --check .

      - name: Build (web app and command-line tools)
        run: npm run build && npm run build:cli

  # Web frontend tests: unit (Vitest, server + Chromium components), integration
  # (Playwright on the production build) and scale suite, against MongoDB, the backend
  # and the grading agents built from this repository (frontend/e2e/compose.yml).
  # Unit and integration coverage must stay at 95 % or more on every metric.
  frontend_tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: frontend
    env:
      E2E_TASKS_DIR: ${{ github.workspace }}/frontend/e2e/.tasks
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies and Chromium
        run: npm ci && npx playwright install --with-deps chromium

      - name: Start MongoDB, backend, agents and Mailpit
        run: |
          mkdir -p e2e/.tasks /tmp/agent_data
          docker compose -f e2e/compose.yml up -d --build
          # MongoDB and the backend accept connections, then the agents register their environments.
          timeout 120 sh -c 'until nc -z 127.0.0.1 27017 && nc -z 127.0.0.1 2000; do sleep 2; done'
          sleep 20
        timeout-minutes: 30

      - name: Unit tests (coverage ≥ 95 %)
        run: npm run test:unit

      - name: Integration tests (coverage ≥ 95 %)
        run: npm run test:e2e

      # Informative on shared CI runners (slower than the reference machine): results are uploaded.
      - name: Scale suite (budgets of frontend/docs/performance.md)
        run: npm run test:perf
        continue-on-error: true

      - name: Service logs on failure
        if: failure()
        run: docker compose -f e2e/compose.yml logs --tail=200

      - name: Save reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-reports
          path: |
            frontend/coverage/unit
            frontend/coverage/e2e/report
            frontend/test-results
            frontend/perf/results
          if-no-files-found: ignore
